<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="p-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="p-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="176" height="176" rx="42" ry="42" fill="url(#p-bg-grad)" stroke="#1e293b" stroke-width="2.5" />

  <!-- Ambient Glow Ring -->
  <circle cx="96" cy="96" r="62" fill="none" stroke="url(#p-accent-grad)" stroke-width="1.5" opacity="0.3" />

  <!-- Pravah 'P' Emblem with Dynamic Flow -->
  <g filter="url(#p-glow)">
    <!-- Vertical stem -->
    <rect x="62" y="48" width="16" height="96" rx="8" fill="url(#p-accent-grad)" />
    <!-- Curved loop -->
    <path d="M 68 48 H 108 C 128 48 136 62 136 78 C 136 94 128 108 108 108 H 72" fill="none" stroke="url(#p-accent-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dynamic orbital flow dot -->
    <circle cx="106" cy="78" r="6" fill="#38bdf8" />
  </g>
</svg>
