<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="p-bg-maskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="p-accent-maskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="p-glow-maskable" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#p-bg-maskable)" />

  <!-- Ambient Flow Halo within Safe Area (inner 80% circle = radius 204) -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#p-accent-maskable)" stroke-width="2.5" opacity="0.4" />

  <!-- Pravah 'P' Emblem within Safe Area -->
  <g filter="url(#p-glow-maskable)">
    <!-- Vertical stem -->
    <rect x="180" y="148" width="36" height="216" rx="18" fill="url(#p-accent-maskable)" />
    <!-- Flow loop -->
    <path d="M 194 148 H 282 C 328 148 348 180 348 216 C 348 252 328 284 282 284 H 202" fill="none" stroke="url(#p-accent-maskable)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dynamic orbital flow dot -->
    <circle cx="276" cy="216" r="14" fill="#38bdf8" />
  </g>
</svg>
